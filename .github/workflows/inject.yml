name: Inject iSponsorBlock into IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct download URL of a DECRYPTED official YouTube .ipa"
        required: true
      substrate_url:
        description: "Optional: direct URL to a substrate/ElleKit build (.deb, .zip or libellekit.dylib / CydiaSubstrate binary). Leave empty to auto-search."
        required: false
        default: ""
      bundle_substrate:
        description: "Bundle ElleKit as CydiaSubstrate (untick if your signer already provides substrate)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: pip install lief

      - name: Download decrypted IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          url="$IPA_URL"
          case "$url" in
            *dropbox.com*) url=$(echo "$url" | sed -E 's/([?&])dl=0/\1dl=1/'); case "$url" in *dl=1*) ;; *) url="$url$(case "$url" in *\?*) echo '&';; *) echo '?';; esac)dl=1";; esac;;
          esac
          curl -fL --retry 3 -o input.ipa "$url"
          ls -la input.ipa
          unzip -tq input.ipa >/dev/null || { echo "::error::Downloaded file is not a valid IPA/zip (wrong link?)"; exit 1; }

      - name: Fetch ElleKit (substrate replacement)
        if: ${{ inputs.bundle_substrate }}
        env:
          GH_TOKEN: ${{ github.token }}
          SUB_URL: ${{ inputs.substrate_url }}
        run: |
          mkdir ek && cd ek
          if [ -n "$SUB_URL" ]; then
            curl -fL --retry 3 -o sub.bin "$SUB_URL"
          else
            for repo in evelyneee/ellekit tealbathingsuit/ellekit; do
              if gh release download --repo "$repo" --pattern '*.deb' --clobber 2>/dev/null; then echo "got release from $repo"; break; fi
              echo "no downloadable release in $repo"
            done
          fi
          # unpack whatever we got
          for f in *.deb; do [ -f "$f" ] && { mkdir "x_$f"; (cd "x_$f" && ar x "../$f" && tar -xf data.tar*); }; done
          [ -f sub.bin ] && { file sub.bin | grep -qi 'zip' && { mkdir xz; unzip -q sub.bin -d xz; } || true; }
          find . -type f | head -50
          f=$(find . \( -name 'libellekit.dylib' -o -name 'CydiaSubstrate' -o -name 'libsubstrate.dylib' \) -type f | head -1)
          if [ -z "$f" ] && [ -f sub.bin ] && file sub.bin | grep -q 'Mach-O'; then f=sub.bin; fi
          [ -n "$f" ] || { echo "::error::No substrate/ElleKit binary found. Re-run with the substrate_url input, or untick bundle_substrate and sign with Sideloadly 'Use Substrate'."; exit 1; }
          cp "$f" ../substrate.dylib
          echo "Using $f"; file ../substrate.dylib

      - name: Inject
        run: |
          args=""
          if [ -f substrate.dylib ]; then args="--substrate substrate.dylib --require-substrate"; fi
          python3 scripts/inject.py input.ipa YouTube-iSponsorBlock.ipa $args

      - uses: actions/upload-artifact@v4
        with:
          name: YouTube-iSponsorBlock
          path: YouTube-iSponsorBlock.ipa
