name: Inject iSponsorBlock into IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct download URL of a DECRYPTED official YouTube .ipa"
        required: true
      bundle_substrate:
        description: "Bundle the built-in CydiaSubstrate shim (recommended: keep ticked)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  inject:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install lief

      - name: Download decrypted IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          url="$IPA_URL"
          case "$url" in
            *dropbox.com*) url=$(echo "$url" | sed -E 's/([?&])dl=0/\1dl=1/'); case "$url" in *dl=1*) ;; *) url="$url$(case "$url" in *\?*) echo '&';; *) echo '?';; esac)dl=1";; esac;;
          esac
          curl -fL --retry 3 -o input.ipa "$url"
          ls -la input.ipa
          unzip -tq input.ipa >/dev/null || { echo "::error::Downloaded file is not a valid IPA/zip (wrong link?)"; exit 1; }

      - name: Build CydiaSubstrate shim
        if: ${{ inputs.bundle_substrate }}
        run: |
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=13.0 -dynamiclib \
            -install_name @rpath/CydiaSubstrate.framework/CydiaSubstrate \
            -lobjc -o substrate.dylib shim/substrate_shim.c
          file substrate.dylib
          nm -gU substrate.dylib

      - name: Inject
        run: |
          args=""
          if [ -f substrate.dylib ]; then args="--substrate substrate.dylib --require-substrate"; fi
          python3 scripts/inject.py input.ipa YouTube-iSponsorBlock.ipa $args

      - uses: actions/upload-artifact@v4
        with:
          name: YouTube-iSponsorBlock
          path: YouTube-iSponsorBlock.ipa
